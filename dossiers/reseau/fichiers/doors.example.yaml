# Configuration des portes — EXEMPLE à adapter. Les valeurs de temps et de vision sont des
# points de départ prudents : elles doivent être remplacées par les mesures de chaque porte.
# Aucun secret ici : le jeton est lu dans la variable d'environnement indiquée (token_env).

log_dir: /data/logs

defaults:
  port: 80
  token_env: SPOT_DOOR_TOKEN
  request_timeout_s: 2.0
  request_retries: 2
  open_timeout_s: 20.0        # impulsion -> passage libre confirmé (mesuré + marge)
  hold_open_s: 25.0           # porte ouverte après impulsion (MESURER la tempo réelle)
  crossing_time_s: 8.0        # franchissement complet par Spot (MESURER)
  safety_margin_s: 5.0
  max_open_attempts: 2
  repulse_resets_timer: false # passer à true seulement si l'essai le prouve
  close_mode: auto            # auto : la porte se referme seule ; commande : voir P06 ci-dessous
  vision:
    method: depth             # depth | input | both
    depth_sources: [frontleft_depth, frontright_depth]
    door_plane_x_m: 1.8
    plane_tolerance_m: 0.35
    half_width_m: 0.55
    floor_z_m: -0.45
    clear_height_m: 1.0
    max_points_in_box: 40
    min_valid_points: 1500
    max_image_age_s: 1.0
    stable_free_s: 1.0
    period_s: 0.2

doors:
  - door_id: P01
    name: "Porte pilote =1AD3 / BC0412"
    host: 10.0.0.41           # adresse réservée par l'informatique du site (exemple)
  - door_id: P02
    name: "Porte 2"
    host: 10.0.0.42
  - door_id: P03
    name: "Porte 3"
    host: 10.0.0.43
  - door_id: P04
    name: "Porte 4"
    host: 10.0.0.44
  - door_id: P05
    name: "Porte 5"
    host: 10.0.0.45
  # Porte qui NE se referme PAS seule : Spot demande la fermeture (relais K2, en parallèle du
  # bouton de fermeture, fils 5-6 du câble) en arrivant en zone X = fin de la région
  # « porte-auto », après la porte. Sur la carte : « set close 1 » au port série.
  # - door_id: P06
  #   name: "Porte 6 (fermeture commandée)"
  #   host: 10.0.0.46
  #   close_mode: commande
  #   close_time_s: 8.0                 # descente complète mesurée après l'impulsion K2
  #   close_confirm_timeout_s: 13.0     # défaut : close_time_s + 5
  #   max_close_attempts: 2
  #   clear_before_close_timeout_s: 20.0
  #   closed_stable_s: 2.0
  #   close_vision:                     # caméra ARRIÈRE de Spot arrêté en zone X
  #     depth_sources: [back_depth]     # nom à vérifier avec get_image.py --list (SDK 5.2)
  #     door_plane_x_m: -1.8            # porte DERRIÈRE le robot : valeur négative, à mesurer
